name: librenms-easydeploy

x-librenms-environment: &librenms-environment
  TZ: ${TZ:-UTC}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  DB_HOST: db
  DB_NAME: ${DB_NAME:-librenms}
  DB_USER: ${DB_USER:-librenms}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_PORT: "3306"
  DB_TIMEOUT: "60"
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  CACHE_DRIVER: ${CACHE_DRIVER:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  LIBRENMS_SNMP_COMMUNITY: ${LIBRENMS_SNMP_COMMUNITY:?LIBRENMS_SNMP_COMMUNITY is required}

x-librenms-service: &librenms-service
  image: librenms/librenms:26.7.0
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - NET_RAW
  volumes:
    - ./data/librenms:/data
  networks:
    - librenms-net
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  librenms:
    <<: *librenms-service
    hostname: librenms
    environment:
      <<: *librenms-environment
      LIBRENMS_BASE_URL: ${LIBRENMS_BASE_URL:-/}
    # Default HTTP: set LIBRENMS_HTTP_PUBLISH=80:8000 in .env.
    # With TLS: 127.0.0.1:8000:8000 so only loopback is exposed (Caddy serves :80/:443).
    # Note: do not use ${VAR:-80:8000} — Compose treats the extra colon as syntax.
    ports:
      - "${LIBRENMS_HTTP_PUBLISH:?LIBRENMS_HTTP_PUBLISH is required (e.g. 80:8000)}"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  dispatcher:
    <<: *librenms-service
    hostname: librenms-dispatcher
    environment:
      <<: *librenms-environment
      DISPATCHER_NODE_ID: dispatcher1
      SIDECAR_DISPATCHER: "1"
    depends_on:
      librenms:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  syslogng:
    <<: *librenms-service
    hostname: librenms-syslogng
    environment:
      <<: *librenms-environment
      SIDECAR_SYSLOGNG: "1"
    ports:
      - "514:514/tcp"
      - "514:514/udp"
    depends_on:
      librenms:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  snmptrapd:
    <<: *librenms-service
    hostname: librenms-snmptrapd
    environment:
      <<: *librenms-environment
      SIDECAR_SNMPTRAPD: "1"
      SNMP_USER: ${SNMP_USER:-librenms_user}
      SNMP_AUTH: ${SNMP_AUTH:?SNMP_AUTH is required}
      SNMP_PRIV: ${SNMP_PRIV:?SNMP_PRIV is required}
      SNMP_ENGINEID: ${SNMP_ENGINEID:?SNMP_ENGINEID is required}
      SNMP_DISABLE_AUTHORIZATION: ${SNMP_DISABLE_AUTHORIZATION:-no}
    ports:
      - "162:162/tcp"
      - "162:162/udp"
    depends_on:
      librenms:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-librenms}
      MARIADB_USER: ${DB_USER:-librenms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/db:/var/lib/mysql
    command:
      - mysqld
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=128M
    healthcheck:
      # Prefer mariadb-admin — matches the installer wait loop and avoids
      # flaky healthcheck.sh false-negatives that block depends_on.
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mariadb-admin ping -hlocalhost -uroot --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s
    networks:
      - librenms-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        {
          printf 'requirepass %s\n' "$$REDIS_PASSWORD"
          printf 'maxmemory 512mb\n'
          printf 'maxmemory-policy noeviction\n'
          printf 'appendonly yes\n'
        } >/tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - librenms-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 128M

  # Optional TLS terminator (docker compose --profile tls up -d).
  # Enabled automatically when the installer configures HTTPS + --le-email.
  caddy:
    image: caddy:2.9-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required when TLS profile is enabled}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required when TLS profile is enabled}
    volumes:
      - ./data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      librenms:
        condition: service_started
    networks:
      - librenms-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  librenms-net:
    driver: bridge
