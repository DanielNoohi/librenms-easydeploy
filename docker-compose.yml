services:
  # LibreNMS web application + alerting
  librenms:
    image: librenms/librenms:26.7.0
    container_name: librenms
    hostname: librenms
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DB_TIMEOUT=60
      - MEMCACHED_HOST=${MEMCACHED_HOST:-memcached}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_DRIVER=${CACHE_DRIVER:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - BASE_URL=${BASE_URL:-http://localhost}
      - POLLERS=${POLLERS:-16}
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
      - ./config/librenms:/opt/librenms/config.d
      - ./rrd:/opt/librenms/rrd
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Distributed poller (official sidecar — SIDECAR_DISPATCHER=1)
  dispatcher:
    image: librenms/librenms:26.7.0
    container_name: librenms-dispatcher
    hostname: librenms-dispatcher
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DB_TIMEOUT=60
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SIDECAR_DISPATCHER=1
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
    depends_on:
      librenms:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - librenms-net

  # Syslog-ng sidecar (official — SIDECAR_SYSLOGNG=1, UDP 514)
  syslogng:
    image: librenms/librenms:26.7.0
    container_name: librenms-syslogng
    hostname: librenms-syslogng
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DB_TIMEOUT=60
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SIDECAR_SYSLOGNG=1
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
    ports:
      - "514:514/udp"
    depends_on:
      librenms:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - librenms-net

  # SNMP trap receiver (official — SIDECAR_SNMPTRAPD=1, UDP 162)
  snmptrapd:
    image: librenms/librenms:26.7.0
    container_name: librenms-snmptrapd
    hostname: librenms-snmptrapd
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DB_TIMEOUT=60
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SIDECAR_SNMPTRAPD=1
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
    ports:
      - "162:162/udp"
    depends_on:
      librenms:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - librenms-net

  # MariaDB 10.11
  db:
    image: mariadb:10.11
    container_name: librenms-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-librenms}
      - MYSQL_USER=${DB_USER:-librenms}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/db:/var/lib/mysql
    command:
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
      - --innodb_buffer_pool_size=256M
    healthcheck:
      # Official MariaDB image helper — no password on process argv
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - librenms-net

  # Memcached (cache backend)
  memcached:
    image: memcached:1.6-alpine
    container_name: librenms-memcached
    restart: unless-stopped
    command: -m 64
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD-SHELL", "echo version | nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis (cache + queue backend) — password required on the bridge network
  redis:
    image: redis:7-alpine
    container_name: librenms-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  librenms-net:
    driver: bridge
