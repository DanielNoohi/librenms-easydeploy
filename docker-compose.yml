version: '3.8'

services:
  # Main LibreNMS application
  librenms:
    image: librenms/librenms:24.10.0
    container_name: librenms
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - MEMCACHED_HOST=memcached
      - REDIS_HOST=redis
      - BASE_URL=${BASE_URL:-http://localhost}
      - POLLERS=${POLLERS:-16}
      - ENABLE_SYSLOG=${ENABLE_SYSLOG:-true}
      - ENABLE_SNMPTRAP=${ENABLE_SNMPTRAP:-true}
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
      - ./config/librenms:/opt/librenms/config.d
      - ./rrd:/opt/librenms/rrd
    ports:
      - "80:8000"
      - "443:8443"
      - "162:162/udp"
      - "161:161/udp"
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Dispatcher for distributed polling
  dispatcher:
    image: librenms/librenms:24.10.0
    container_name: librenms-dispatcher
    restart: unless-stopped
    command: dispatcher
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - MEMCACHED_HOST=memcached
      - REDIS_HOST=redis
      - BASE_URL=${BASE_URL:-http://localhost}
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
      - ./config/librenms:/opt/librenms/config.d
      - ./rrd:/opt/librenms/rrd
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD", "php", "/opt/librenms/artisan", "librenms:dispatcher:health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Syslog server for network device logs
  syslog:
    image: librenms/librenms:24.10.0
    container_name: librenms-syslog
    restart: unless-stopped
    command: syslog
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - MEMCACHED_HOST=memcached
      - REDIS_HOST=redis
      - BASE_URL=${BASE_URL:-http://localhost}
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
      - ./config/librenms:/opt/librenms/config.d
    ports:
      - "514:514/udp"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - librenms-net

  # SNMP trap receiver
  snmptrap:
    image: librenms/librenms:24.10.0
    container_name: librenms-snmptrap
    restart: unless-stopped
    command: snmptrap
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-librenms}
      - DB_USER=${DB_USER:-librenms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - MEMCACHED_HOST=memcached
      - REDIS_HOST=redis
      - BASE_URL=${BASE_URL:-http://localhost}
    volumes:
      - ./data/librenms:/data
      - ./logs/librenms:/opt/librenms/logs
      - ./config/librenms:/opt/librenms/config.d
    ports:
      - "162:162/udp"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - librenms-net

  # MariaDB database
  db:
    image: mariadb:10.11
    container_name: librenms-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-librenms}
      - MYSQL_USER=${DB_USER:-librenms}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/db:/var/lib/mysql
    command:
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --max_allowed_packet=64M
      - --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - librenms-net

  # Memcached for caching
  memcached:
    image: memcached:1.6-alpine
    container_name: librenms-memcached
    restart: unless-stopped
    command: -m 64
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD", "memcached-tool", "localhost:11211", "stats"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis for cache/queue
  redis:
    image: redis:7-alpine
    container_name: librenms-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    networks:
      - librenms-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Traefik reverse proxy with Let's Encrypt (comment out if not needed)
  # traefik:
  #   image: traefik:v3.0
  #   container_name: librenms-traefik
  #   restart: unless-stopped
  #   command:
  #     - --api.dashboard=true
  #     - --providers.docker=true
  #     - --providers.docker.exposedbydefault=false
  #     - --entrypoints.web.address=:80
  #     - --entrypoints.websecure.address=:443
  #     - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
  #     - --certificatesresolvers.letsencrypt.acme.email=${LE_EMAIL}
  #     - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./letsencrypt:/letsencrypt
  #   networks:
  #     - librenms-net
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.librenms.rule=Host(`${BASE_URL#*://}`)
  #     - traefik.http.routers.librenms.entrypoints=websecure
  #     - traefik.http.routers.librenms.tls.certresolver=letsencrypt
  #     - traefik.http.services.librenms.loadbalancer.server.port=8000

networks:
  librenms-net:
    driver: bridge
    internal: false