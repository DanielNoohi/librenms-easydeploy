name: librenms-easydeploy

x-librenms-environment: &librenms-environment
  TZ: ${TZ:-UTC}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  DB_HOST: db
  DB_NAME: ${DB_NAME:-librenms}
  DB_USER: ${DB_USER:-librenms}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_PORT: "3306"
  DB_TIMEOUT: "60"
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  CACHE_DRIVER: ${CACHE_DRIVER:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  LIBRENMS_SNMP_COMMUNITY: ${LIBRENMS_SNMP_COMMUNITY:?LIBRENMS_SNMP_COMMUNITY is required}

x-librenms-service: &librenms-service
  image: librenms/librenms:26.7.0
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - NET_RAW
  volumes:
    - ./data/librenms:/data
  networks:
    - librenms-net
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  librenms:
    <<: *librenms-service
    hostname: librenms
    environment:
      <<: *librenms-environment
      LIBRENMS_BASE_URL: ${LIBRENMS_BASE_URL:-/}
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  dispatcher:
    <<: *librenms-service
    hostname: librenms-dispatcher
    environment:
      <<: *librenms-environment
      DISPATCHER_NODE_ID: dispatcher1
      SIDECAR_DISPATCHER: "1"
    depends_on:
      librenms:
        condition: service_healthy
      redis:
        condition: service_healthy

  syslogng:
    <<: *librenms-service
    hostname: librenms-syslogng
    environment:
      <<: *librenms-environment
      SIDECAR_SYSLOGNG: "1"
    ports:
      - "514:514/tcp"
      - "514:514/udp"
    depends_on:
      librenms:
        condition: service_healthy
      redis:
        condition: service_healthy

  snmptrapd:
    <<: *librenms-service
    hostname: librenms-snmptrapd
    environment:
      <<: *librenms-environment
      SIDECAR_SNMPTRAPD: "1"
      SNMP_USER: ${SNMP_USER:-librenms_user}
      SNMP_AUTH: ${SNMP_AUTH:?SNMP_AUTH is required}
      SNMP_PRIV: ${SNMP_PRIV:?SNMP_PRIV is required}
      SNMP_ENGINEID: ${SNMP_ENGINEID:?SNMP_ENGINEID is required}
      SNMP_DISABLE_AUTHORIZATION: ${SNMP_DISABLE_AUTHORIZATION:-no}
    ports:
      - "162:162/tcp"
      - "162:162/udp"
    depends_on:
      librenms:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-librenms}
      MARIADB_USER: ${DB_USER:-librenms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/db:/var/lib/mysql
    command:
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - librenms-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        {
          printf 'requirepass %s\n' "$$REDIS_PASSWORD"
          printf 'maxmemory 512mb\n'
          printf 'maxmemory-policy noeviction\n'
          printf 'appendonly yes\n'
        } >/tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - librenms-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  librenms-net:
    driver: bridge
