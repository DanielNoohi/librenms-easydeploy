name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single preflight job avoids burning multiple hosted-runner slots in parallel
  # (GitHub has been failing to acquire runners for multi-job starts).
  checks:
    name: Lint, tests, and compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt bats
      - name: ShellCheck
        run: shellcheck librenms-auto-install.sh
      - name: shfmt
        run: shfmt -d -i 2 librenms-auto-install.sh
      - name: Bats tests
        run: bats test/
      - name: Validate docker-compose.yml
        run: |
          set -euo pipefail
          # Required ${VAR:?...} placeholders need values; .env.example is safe.
          set -a
          # shellcheck disable=SC1091
          source .env.example
          set +a
          docker compose -f docker-compose.yml config --quiet
      - name: Validate TLS compose profile
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .env.example
          set +a
          export CADDY_EMAIL=ci@example.com
          export CADDY_SITE_ADDRESS=librenms.example.com
          export LIBRENMS_HTTP_PUBLISH=127.0.0.1:8000:8000
          export COMPOSE_PROFILES=tls
          mkdir -p data/caddy
          cat >data/caddy/Caddyfile <<'EOF'
          {
            email {$CADDY_EMAIL}
          }
          {$CADDY_SITE_ADDRESS} {
            reverse_proxy librenms:8000
          }
          EOF
          docker compose -f docker-compose.yml --profile tls config --quiet
          docker compose -f docker-compose.yml --profile tls config --services | grep -qx caddy
      - name: No :latest tags
        run: |
          if grep -q ':latest' docker-compose.yml; then
            echo "::error::Found :latest tag"
            exit 1
          fi
      - name: All services present
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .env.example
          set +a
          SERVICES=$(docker compose -f docker-compose.yml config --services)
          for svc in db redis librenms dispatcher syslogng snmptrapd; do
            echo "$SERVICES" | grep -q "^${svc}$" || { echo "::error::Missing: $svc"; exit 1; }
          done
          # caddy is profile-gated and must NOT appear without --profile tls
          if echo "$SERVICES" | grep -qx caddy; then
            echo "::error::caddy should only appear with --profile tls"
            exit 1
          fi
      - name: ShellCheck day-2 scripts
        run: shellcheck scripts/backup.sh scripts/restore.sh scripts/docker-user-ufw.sh
      - name: Embedded compose matches docker-compose.yml
        run: python3 scripts/sync_embedded_compose.py --check
      - name: Secret hygiene
        run: |
          set -euo pipefail

          git check-ignore -q .env || {
            echo "::error file=.gitignore::.env must be ignored"
            exit 1
          }

          required_placeholders=(
            DB_PASSWORD DB_ROOT_PASSWORD REDIS_PASSWORD ADMIN_PASS
            LIBRENMS_SNMP_COMMUNITY SNMP_AUTH SNMP_PRIV SNMP_ENGINEID
          )
          for key in "${required_placeholders[@]}"; do
            grep -qx "${key}=changeme" .env.example || {
              echo "::error file=.env.example::${key} must use the changeme placeholder"
              exit 1
            }
          done

          if git ls-files | grep -Eq '(^|/)(\.env|credentials|.*\.pem|id_rsa)$'; then
            echo "::error::A credential-like file is tracked"
            git ls-files | grep -E '(^|/)(\.env|credentials|.*\.pem|id_rsa)$' || true
            exit 1
          fi

  e2e:
    name: E2E installer and stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [checks]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the real installer
        run: |
          set -euo pipefail
          INSTALL_DIR="/opt/librenms-e2e"
          sudo ./librenms-auto-install.sh \
            --non-interactive \
            --url http://localhost \
            --timezone UTC \
            --pollers 2 \
            --dir "$INSTALL_DIR" \
            --save-creds /tmp/librenms-e2e-credentials \
            --no-firewall \
            --no-ssl
      - name: Verify generated files and services
        run: |
          set -euo pipefail
          cd /opt/librenms-e2e
          # Installer writes .env as root:600; use sudo for reads/compose.
          test "$(sudo stat -c '%a' .env)" = "600"
          test "$(stat -c '%a' /tmp/librenms-e2e-credentials)" = "600"
          sudo grep -qx 'SNMP_DISABLE_AUTHORIZATION=no' .env
          grep -qx 'enable_syslog: true' data/librenms/config/syslog.yaml

          expected_services='db dispatcher librenms redis snmptrapd syslogng'
          # Wait briefly after installer exit for sidecars to report running
          for i in $(seq 1 30); do
            actual_services=$(sudo docker compose ps --services --status running | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            if [ "$actual_services" = "$expected_services" ]; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "::error::Expected running services: $expected_services"
              echo "::error::Actual: $actual_services"
              sudo docker compose ps || true
              exit 1
            fi
          done

          # Avoid curl|grep -q under pipefail: grep exits early → curl EPIPE (exit 23).
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost/ -o /tmp/librenms-home.html \
              && grep -qi 'librenms' /tmp/librenms-home.html; then
              break
            fi
            sleep 2
            [ "$i" -eq 30 ] && { echo "::error::HTTP probe failed"; exit 1; }
          done

          set -a
          # shellcheck disable=SC1091
          # root-owned .env is unreadable without sudo; load via process substitution
          source <(sudo cat .env)
          set +a
          admin_count=$(
            sudo docker compose exec -T -e MYSQL_PWD="$DB_PASSWORD" db \
              mariadb -u"$DB_USER" "$DB_NAME" --batch --skip-column-names \
              -e "SELECT COUNT(*) FROM users WHERE username='admin' AND auth_type='mysql';"
          )
          admin_count=$(echo "$admin_count" | tr -d '[:space:]')
          test "$admin_count" = "1"

          if sudo grep -q '^INSTALL=' data/librenms/.env 2>/dev/null; then
            echo "::error::Web installer marker still present"
            exit 1
          fi

          set +e
          sudo docker compose exec -T librenms \
            php validate.php 2>&1 | tee /tmp/validate.log
          validate_rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^\[FAIL\]' /tmp/validate.log; then
            echo "::warning::validate.php reported FAIL checks (shown below)"
            grep '^\[FAIL\]' /tmp/validate.log || true
          fi
          # Hard-fail only on core connectivity — mail/DNS advisories are expected in CI
          if grep -E '^\[FAIL\].*(Database|MariaDB|MySQL|Redis|SQL|Unable to connect|Connection refused)' \
            /tmp/validate.log; then
            echo "::error::LibreNMS validate.php reported a core connectivity FAIL"
            exit 1
          fi
          if [ "$validate_rc" -ne 0 ]; then
            echo "::warning::validate.php exited $validate_rc"
          fi
      - name: Verify idempotence and safe configuration updates
        run: |
          set -euo pipefail
          cd /opt/librenms-e2e
          before=$(sudo sha256sum .env | cut -d' ' -f1)
          sudo "$GITHUB_WORKSPACE/librenms-auto-install.sh" \
            --non-interactive \
            --url http://localhost \
            --dir /opt/librenms-e2e \
            --no-firewall \
            --no-ssl
          after=$(sudo sha256sum .env | cut -d' ' -f1)
          test "$before" = "$after"

          for i in $(seq 1 30); do
            running_count=$(sudo docker compose ps --services --status running | wc -l | tr -d '[:space:]')
            if [ "$running_count" = "6" ]; then
              break
            fi
            sleep 2
            [ "$i" -eq 30 ] && { echo "::error::Expected 6 running services, got $running_count"; exit 1; }
          done
          curl -fsSL http://localhost/ -o /tmp/librenms-home.html
          grep -qi 'librenms' /tmp/librenms-home.html

          set -a
          # shellcheck disable=SC1091
          source <(sudo cat .env)
          set +a
          original_db_password="$DB_PASSWORD"

          sudo "$GITHUB_WORKSPACE/librenms-auto-install.sh" \
            --non-interactive \
            --url http://localhost \
            --dir /opt/librenms-e2e \
            --pollers 3 \
            --no-firewall \
            --no-ssl
          sudo grep -qx 'POLLERS=3' .env
          sudo grep -qx "DB_PASSWORD=${original_db_password}" .env
          # Backups are root-owned; count them with sudo.
          backups_before=$(sudo find . -maxdepth 1 -name '.env.bak_*' | wc -l | tr -d '[:space:]')
          test "$backups_before" -ge 1
          sudo "$GITHUB_WORKSPACE/librenms-auto-install.sh" \
            --non-interactive \
            --url http://localhost \
            --dir /opt/librenms-e2e \
            --force \
            --no-firewall \
            --no-ssl
          backups_after=$(sudo find . -maxdepth 1 -name '.env.bak_*' | wc -l | tr -d '[:space:]')
          test "$backups_after" -gt "$backups_before"
          sudo grep -qx "DB_PASSWORD=${original_db_password}" .env
          curl -fsSL http://localhost/ -o /tmp/librenms-home.html
          grep -qi 'librenms' /tmp/librenms-home.html
      - name: Logs on failure
        if: failure()
        run: |
          set +e
          cd /opt/librenms-e2e
          # .env is root:600 from the installer; Compose needs it (or sudo).
          sudo docker compose ps || true
          for s in librenms db redis dispatcher syslogng snmptrapd; do
            echo "--- $s ---"
            sudo docker compose logs --tail=120 "$s" || true
          done
      - name: Cleanup
        if: always()
        run: cd /opt/librenms-e2e && sudo docker compose down -v --remove-orphans 2>/dev/null || true
