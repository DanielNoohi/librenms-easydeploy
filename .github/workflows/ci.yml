name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: ShellCheck
        run: shellcheck librenms-auto-install.sh
      - name: shfmt
        run: shfmt -d -i 2 librenms-auto-install.sh

  test:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Bats tests
        run: bats test/

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: No :latest tags
        run: |
          if grep -q ':latest' docker-compose.yml; then
            echo "::error::Found :latest tag"
            exit 1
          fi
      - name: All services present
        run: |
          SERVICES=$(docker compose -f docker-compose.yml config --services)
          for svc in db redis memcached librenms dispatcher syslogng snmptrapd; do
            echo "$SERVICES" | grep -q "^${svc}$" || { echo "::error::Missing: $svc"; exit 1; }
          done

  secret-scan:
    name: Secret scanning (fail CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for embedded secrets
        run: |
          FAIL=0
          if grep -qE 'DB_PASSWORD=.{8,}|DB_ROOT_PASSWORD=.{8,}' .env.example 2>/dev/null; then
            grep -q 'changeme' .env.example || { echo "::error file=.env.example::Real secrets"; FAIL=1; }
          fi
          COMPOSE=$(grep -oE 'EMBEDDED_COMPOSE_B64="[^"]*"' librenms-auto-install.sh | sed 's/EMBEDDED_COMPOSE_B64="//;s/"$//' | base64 -d 2>/dev/null || true)
          echo "$COMPOSE" | grep -qiE 'password\s*[=:]\s*[a-zA-Z0-9]{8,}' && { echo "::error::Hardcoded passwords"; FAIL=1; } || true
          exit $FAIL

  e2e:
    name: E2E Docker Compose startup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Write .env and start stack
        run: |
          set -e
          INSTALL_DIR="/opt/librenms-e2e"
          mkdir -p "$INSTALL_DIR"
          cp docker-compose.yml "$INSTALL_DIR/"
          cd "$INSTALL_DIR"
          # Write .env line-by-line to avoid heredoc YAML indentation issues
          echo "TZ=UTC" > .env
          echo "PUID=1000" >> .env
          echo "PGID=1000" >> .env
          echo "DB_NAME=librenms" >> .env
          echo "DB_USER=librenms" >> .env
          echo "DB_PASSWORD=e2etestpass123" >> .env
          echo "DB_ROOT_PASSWORD=e2etestroot123" >> .env
          echo "MEMCACHED_HOST=memcached" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "CACHE_DRIVER=redis" >> .env
          echo "SESSION_DRIVER=redis" >> .env
          echo "BASE_URL=http://localhost" >> .env
          echo "POLLERS=2" >> .env
          echo "ADMIN_PASS=e2eadminpass123" >> .env
          echo "ADMIN_EMAIL=admin@e2etest.local" >> .env
          echo "--- .env ---"
          cat .env
          echo "--- validate config ---"
          docker compose config --quiet 2>&1 || { echo "::error::compose config invalid"; exit 1; }
          echo "--- pull images ---"
          docker compose pull 2>&1 || { echo "::error::image pull failed"; exit 1; }
          echo "--- start backing services ---"
          docker compose up -d db redis memcached 2>&1
          echo "--- wait for db healthy ---"
          for i in $(seq 1 60); do
            docker compose exec -T db mysqladmin ping -h localhost -u root -pe2etestroot123 --silent 2>/dev/null && echo "DB ready" && break
            sleep 2
          done
          echo "--- start librenms ---"
          docker compose up -d librenms 2>&1 || {
            echo "::error::librenms failed to start"
            docker compose logs --tail=30 librenms 2>&1 | sed 's/^/::error::LNMS: /'
            docker compose ps 2>&1 | sed 's/^/::error::PS: /'
            exit 1
          }
          echo "--- services started ---"
          docker compose ps
          echo "--- services ---"
          docker compose ps
      - name: Wait for all services healthy
        run: |
          cd /opt/librenms-e2e
          echo "Waiting for services..."
          for i in $(seq 1 300); do
            HEALTHY=$(docker compose ps 2>/dev/null | grep -c "healthy" || echo "0")
            echo "  [$i] healthy=$HEALTHY/7"
            if [ "$HEALTHY" -ge 4 ]; then
              echo "Core services healthy"
              break
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=10 librenms || true
      - name: Verify HTTP from host
        run: |
          cd /opt/librenms-e2e
          for i in $(seq 1 10); do
            HTTP=$(curl -fL -o /dev/null -w '%{http_code}' http://localhost:80 2>/dev/null || echo "000")
            echo "  [$i] HTTP=$HTTP"
            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 400 ]; then
              echo "LibreNMS responding: HTTP $HTTP"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web UI not responding"
          docker compose logs --tail=30 librenms
          exit 1
      - name: Logs on failure
        if: failure()
        run: |
          cd /opt/librenms-e2e
          docker compose ps || true
          for s in librenms db redis memcached; do
            echo "--- $s ---"
            docker compose logs --tail=20 "$s" || true
          done
      - name: Cleanup
        if: always()
        run: cd /opt/librenms-e2e && docker compose down -v --remove-orphans 2>/dev/null || true
