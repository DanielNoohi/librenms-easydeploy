name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck librenms-auto-install.sh
      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Check formatting
        run: shfmt -d -i 2 librenms-auto-install.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run Bats tests
        run: bats test/

  compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: Check pinned images
        run: |
          if grep -q ':latest' docker-compose.yml; then
            echo "ERROR: Found :latest tag in docker-compose.yml"
            exit 1
          fi
          echo "All images are pinned"

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if grep -rE '(password|secret|token|key)\s*=\s*["'"'"'][^"'"'"']{8,}' --include="*.sh" --include="*.yml" --include="*.md" .; then
            echo "WARNING: Potential hardcoded secret found"
          fi
      - name: Check file permissions
        run: |
          if grep -q 'changeme\|password123\|secret' .env.example 2>/dev/null; then
            echo "INFO: .env.example contains placeholder values (expected)"
          fi
