name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: ShellCheck
        run: shellcheck librenms-auto-install.sh
      - name: shfmt
        run: shfmt -d -i 2 librenms-auto-install.sh

  test:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Bats tests
        run: bats test/

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: No :latest tags
        run: |
          if grep -q ':latest' docker-compose.yml; then
            echo "::error::Found :latest tag in docker-compose.yml"
            exit 1
          fi
          echo "All images pinned"
      - name: Sidecar services present
        run: |
          SERVICES=$(docker compose -f docker-compose.yml config --services)
          for svc in dispatcher syslogng snmptrapd; do
            if ! echo "$SERVICES" | grep -q "^${svc}$"; then
              echo "::error::Missing sidecar: $svc"
              exit 1
            fi
            echo "  $svc present"
          done
          echo "All sidecars present"
      - name: All target services present
        run: |
          SERVICES=$(docker compose -f docker-compose.yml config --services)
          for svc in db redis memcached librenms dispatcher syslogng snmptrapd; do
            if ! echo "$SERVICES" | grep -q "^${svc}$"; then
              echo "::error::Missing service: $svc"
              exit 1
            fi
            echo "  $svc present"
          done

  secret-scan:
    name: Secret scanning (fail CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for embedded secrets
        run: |
          FAIL=0
          echo "=== Scanning .env.example for real secrets ==="
          if grep -qE 'DB_PASSWORD=.{8,}|DB_ROOT_PASSWORD=.{8,}' .env.example 2>/dev/null; then
            if ! grep -q 'changeme' .env.example; then
              echo "::error file=.env.example::Credentials look like real secrets"
              FAIL=1
            fi
          fi
          echo "Checking embedded compose for hardcoded passwords..."
          COMPOSE=$(grep -oE 'EMBEDDED_COMPOSE_B64="[^"]*"' librenms-auto-install.sh | sed 's/EMBEDDED_COMPOSE_B64="//;s/"$//' | base64 -d 2>/dev/null || true)
          if echo "$COMPOSE" | grep -qiE 'password\s*[=:]\s*[a-zA-Z0-9]{8,}'; then
            echo "::error::Embedded compose contains hardcoded passwords"
            FAIL=1
          fi
          echo "=== Secret scan passed ==="
          exit $FAIL

  e2e:
    name: E2E Docker Compose startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: |
          INSTALL_DIR="/opt/librenms-e2e"
          mkdir -p "$INSTALL_DIR"
          cp docker-compose.yml "$INSTALL_DIR/"
          cd "$INSTALL_DIR"
          cat > .env << 'EENV'
          TZ=UTC
          PUID=1000
          PGID=1000
          DB_NAME=librenms
          DB_USER=librenms
          DB_PASSWORD=e2etestpass123
          DB_ROOT_PASSWORD=e2etestroot123
          MEMCACHED_HOST=memcached
          REDIS_HOST=redis
          CACHE_DRIVER=redis
          SESSION_DRIVER=redis
          BASE_URL=http://localhost
          POLLERS=2
          ADMIN_PASS=e2eadminpass123
          ADMIN_EMAIL=admin@e2etest.local
          EENV
          echo "--- .env ---"
          cat -A .env
          docker compose up -d
          echo "--- services starting ---"
          docker compose ps
      - name: Wait for all services healthy
        run: |
          cd /opt/librenms-e2e
          echo "Waiting for all services to become healthy..."
          for i in $(seq 1 240); do
            HEALTHY=$(docker compose ps 2>/dev/null | grep -c "healthy" || echo "0")
            TOTAL=$(docker compose ps 2>/dev/null | grep -cE "(Up|running)" || echo "0")
            echo "  [$i] healthy=$HEALTHY total=$TOTAL"
            # All 7 services should be healthy (db, redis, memcached, librenms + 3 sidecars)
            # But sidecars depend on librenms, so wait for at least 4 core services
            if [ "$HEALTHY" -ge 4 ]; then
              echo "Core services healthy"
              break
            fi
            sleep 5
          done
          echo "--- final state ---"
          docker compose ps || true
          docker compose logs --tail=20 librenms || true
      - name: Verify HTTP from host
        run: |
          cd /opt/librenms-e2e
          echo "Verifying web UI from host..."
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:80 2>/dev/null || echo "000")
            echo "  attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "LibreNMS web UI confirmed: HTTP $HTTP_CODE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::LibreNMS web UI not responding after retries"
          docker compose logs --tail=50 librenms
          exit 1
      - name: Collect logs on failure
        if: failure()
        run: |
          cd /opt/librenms-e2e
          echo "=== service status ==="
          docker compose ps || true
          for svc in librenms db redis memcached; do
            echo "--- $svc logs ---"
            docker compose logs --tail=40 "$svc" || true
          done
      - name: Cleanup
        if: always()
        run: cd /opt/librenms-e2e && docker compose down -v --remove-orphans 2>/dev/null || true
