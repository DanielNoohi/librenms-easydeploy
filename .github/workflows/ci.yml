name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: ShellCheck
        run: shellcheck librenms-auto-install.sh
      - name: shfmt
        run: shfmt -d -i 2 librenms-auto-install.sh

  test:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Bats tests
        run: bats test/

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: No :latest tags
        run: |
          if grep -q ':latest' docker-compose.yml; then
            echo "::error::Found :latest tag in docker-compose.yml"
            exit 1
          fi
          echo "All images pinned"
      - name: Sidecar services present
        run: |
          SERVICES=$(docker compose -f docker-compose.yml config --services)
          for svc in dispatcher syslogng snmptrapd; do
            if ! echo "$SERVICES" | grep -q "^${svc}$"; then
              echo "::error::Missing sidecar: $svc"
              exit 1
            fi
            echo "  $svc present"
          done
          echo "All sidecars present"
      - name: Services present
        run: |
          SERVICES=$(docker compose -f docker-compose.yml config --services)
          for svc in db redis memcached librenms; do
            if ! echo "$SERVICES" | grep -q "^${svc}$"; then
              echo "::error::Missing service: $svc"
              exit 1
            fi
            echo "  $svc present"
          done
          echo "All target services present"

  secret-scan:
    name: Secret scanning (fail CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for embedded secrets
        run: |
          FAIL=0
          echo "=== Scanning for real secrets ==="
          if grep -qE 'DB_PASSWORD=.{8,}|DB_ROOT_PASSWORD=.{8,}' .env.example 2>/dev/null; then
            if ! grep -q 'changeme' .env.example; then
              echo "::error file=.env.example::Credentials look like real secrets"
              FAIL=1
            fi
          fi
          echo "Checking embedded compose for plaintext secrets..."
          COMPOSE=$(grep -oE 'EMBEDDED_COMPOSE_B64="[^"]*"' librenms-auto-install.sh | sed 's/EMBEDDED_COMPOSE_B64="//;s/"$//' | base64 -d 2>/dev/null || true)
          if echo "$COMPOSE" | grep -qiE 'password\s*[=:]\s*[a-zA-Z0-9]{8,}'; then
            echo "::error::Embedded compose contains hardcoded passwords"
            FAIL=1
          fi
          echo "=== Secret scan complete ==="
          exit $FAIL

  e2e:
    name: E2E Docker Compose startup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: |
          INSTALL_DIR="/opt/librenms-e2e"
          mkdir -p "$INSTALL_DIR"
          cp docker-compose.yml "$INSTALL_DIR/"
          cd "$INSTALL_DIR"
          echo "TZ=UTC" > .env
          echo "PUID=1000" >> .env
          echo "PGID=1000" >> .env
          echo "DB_NAME=librenms" >> .env
          echo "DB_USER=librenms" >> .env
          echo "DB_PASSWORD=e2etestpass123" >> .env
          echo "DB_ROOT_PASSWORD=e2etestroot123" >> .env
          echo "MEMCACHED_HOST=memcached" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "CACHE_DRIVER=redis" >> .env
          echo "SESSION_DRIVER=redis" >> .env
          echo "BASE_URL=http://localhost" >> .env
          echo "POLLERS=2" >> .env
          echo "ADMIN_PASS=e2eadminpass123" >> .env
          echo "ADMIN_EMAIL=admin@e2etest.local" >> .env
          echo "=== .env contents ==="
          cat -A .env
          echo "=== docker compose config ==="
          docker compose config --quiet
          echo "=== docker compose up ==="
          set -x
          if ! docker compose up -d 2>&1 | tee /tmp/compose-up.log; then
            echo "::error::docker compose up failed"
            cat /tmp/compose-up.log
            cat .env
            exit 1
          fi
          set +x
          docker compose ps
      - name: Wait for services
        run: |
          set -x
          cd /opt/librenms-e2e
          echo "=== .env contents ==="
          cat .env
          echo "=== docker compose config ==="
          docker compose config --quiet || true
          echo "=== Waiting for services ==="
          for i in $(seq 1 120); do
            RUNNING=$(docker compose ps 2>/dev/null | grep -c "running" || echo "0")
            echo "  $i: $RUNNING services running"
            if [ "$RUNNING" -ge 7 ]; then
              echo "All 7 services started"
              break
            fi
            sleep 5
          done
          echo "=== Final state ==="
          docker compose ps || true
          docker compose logs --tail=30 db || true
          docker compose logs --tail=30 librenms || true
      - name: Verify web UI
        run: |
          cd /opt/librenms-e2e
          echo "Waiting 30s for LibreNMS to fully boot..."
          sleep 30
          for i in $(seq 1 10); do
            HTTP_CODE=$(docker compose exec -T librenms curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
              echo "LibreNMS web UI responding: HTTP $HTTP_CODE"
              exit 0
            fi
            sleep 10
          done
          echo "::error::LibreNMS web UI not responding after retries"
          docker compose logs --tail=50 librenms || true
          exit 1
      - name: Verify sidecars running
        run: |
          cd /opt/librenms-e2e
          for svc in dispatcher syslogng snmptrapd; do
            STATE=$(docker compose ps --service "$svc" --format "{{.State}}" 2>/dev/null || echo "unknown")
            echo "  $svc: $STATE"
            if [ "$STATE" != "running" ]; then
              echo "::error::$svc sidecar not running"
              docker compose logs --tail=20 "$svc" || true
              exit 1
            fi
          done
      - name: Cleanup
        if: always()
        run: cd /opt/librenms-e2e && docker compose down -v --remove-orphans 2>/dev/null || true
